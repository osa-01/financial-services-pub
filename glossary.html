    description: "北海産原油を指標とした国際的な原油価格のベンチマーク。ロンドンのICE取引所で取引され、中東・アジア向け原油価格の決定にも用いられる。WTIよりも地理的に幅広い取引に使われる国際標準。2026年7月31日時点で1バレル$89.95。7/23の$100.65（2022年以来最高値）から米・イラン停戦継続で急落。",
    first_seen: "2026-07-29",
    last_updated: "2026-08-01",
    category: "金融指標"
  },
  {
    term: "Mag7",
    reading: "まぐせぶん",
    english: "Magnificent Seven",
    description: "米国株式市場を牽引するMicrosoft・Apple・Nvidia・Alphabet・Amazon・Meta・Teslaの7大テック企業の総称。S&P 500時価総額の3割超を占め、市場全体のパフォーマンスを左右する。2026年7月決算ではMSFT（Azure+43%）・AAPL（売上+16.6%）・AMZN（AWS+37%）が強く、META（CapEx$31B・EPS miss）・Teslaが失望という二極化が鮮明に。",
    first_seen: "2026-07-29",
    last_updated: "2026-08-01",
    category: "企業・市場"
  }
];

// Sort by reading (五十音順)
terms.sort((a, b) => a.reading.localeCompare(b.reading, 'ja'));

let currentCat = 'all';

function renderTerms() {
  const q = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('terms-list');
  const noResults = document.getElementById('no-results');
  let visible = 0;

  list.innerHTML = '';
  terms.forEach(t => {
    const matchQ = !q ||
      t.term.toLowerCase().includes(q) ||
      t.reading.includes(q) ||
      t.english.toLowerCase().includes(q) ||
      t.description.toLowerCase().includes(q);
    const matchC = currentCat === 'all' || t.category === currentCat;
    if (matchQ && matchC) {
      visible++;
      const card = document.createElement('div');
      card.className = 'term-card';
      card.dataset.category = t.category;
      card.dataset.reading = t.reading;
      card.innerHTML = `
        <div class="term-header">
          <span class="term-name">${t.term}</span>
          <span class="term-reading">${t.reading}</span>
          <span class="term-english">${t.english}</span>
          <span class="term-category">${t.category}</span>
        </div>
        <p class="term-description">${t.description}</p>
        <div class="term-meta">
          <span>初出: ${t.first_seen}</span>
          <span>更新: ${t.last_updated}</span>
        </div>
      `;
      list.appendChild(card);
    }
  });

  document.getElementById('visible-count').textContent = `${visible} 件表示中`;
  noResults.style.display = visible === 0 ? 'block' : 'none';
}

function filterTerms() { renderTerms(); }

function setCat(btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  renderTerms();
}

document.getElementById('total-count').textContent = terms.length;
renderTerms();
</script>
